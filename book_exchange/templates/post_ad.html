{% extends 'base.html' %}

{% block title %}Post an Ad - Student Book Exchange{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card shadow-sm mt-4">
            <div class="card-body p-4">
                <h3 class="card-title text-center mb-4">Post a Book for Sale</h3>
                <form action="{{ url_for('post_ad') }}" method="POST" enctype="multipart/form-data" id="ad-form">
                    <div class="row mb-3">
                        <div class="col-md-6">
                            <label for="title" class="form-label">Book Title *</label>
                            <input type="text" class="form-control" id="title" name="title" required>
                        </div>
                        <div class="col-md-6">
                            <label for="author" class="form-label">Author *</label>
                            <input type="text" class="form-control" id="author" name="author" required>
                        </div>
                    </div>
                    <div class="row mb-3">
                        <div class="col-md-4">
                            <label for="subject" class="form-label">Subject</label>
                            <select class="form-select" id="subject" name="subject">
                                <option value="Computer Science">Computer Science</option>
                                <option value="Mathematics">Mathematics</option>
                                <option value="Physics">Physics</option>
                                <option value="Manga">Manga</option>
                                <option value="Novel">Novel</option>
                                <option value="History">History</option>
                                <option value="Engineering">Engineering</option>
                                <option value="Business">Business</option>
                                <option value="Other">Other</option>
                            </select>
                        </div>
                        <div class="col-md-4">
                            <label for="condition" class="form-label">Condition *</label>
                            <select class="form-select" id="condition" name="condition" required>
                                <option value="New">New</option>
                                <option value="Like New">Like New</option>
                                <option value="Used">Used</option>
                                <option value="Worn">Worn</option>
                            </select>
                        </div>
                        <div class="col-md-4">
                            <label for="price" class="form-label">Price ($) *</label>
                            <input type="number" step="0.01" min="0" class="form-control" id="price" name="price" required>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label for="description" class="form-label">Description (Optional)</label>
                        <textarea class="form-control" id="description" name="description" rows="4" placeholder="Mention edition, highlighting, missing pages, etc."></textarea>
                    </div>
                    <div class="mb-4">
                        <label for="image" class="form-label">Upload Photo (Optional)</label>
                        <input class="form-control" type="file" id="image" name="image" accept="image/png, image/jpeg, image/jpg, image/gif">
                        <div class="mt-2 text-center">
                            <img id="image-preview" src="#" alt="Image Preview" style="display: none; max-height: 200px; margin: 0 auto; border-radius: 8px;" class="shadow-sm">
                        </div>
                    </div>
                    <div class="d-grid">
                        <button type="submit" class="btn btn-primary btn-lg">Post Ad</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
