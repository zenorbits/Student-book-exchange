{% extends 'base.html' %}

{% block title %}Edit Ad - Student Book Exchange{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card shadow-sm mt-4">
            <div class="card-body p-4">
                <h3 class="card-title text-center mb-4">Edit Listing</h3>
                <form action="{{ url_for('edit_ad', id=book.id) }}" method="POST" enctype="multipart/form-data" id="ad-form">
                    <div class="row mb-3">
                        <div class="col-md-6">
                            <label for="title" class="form-label">Book Title *</label>
                            <input type="text" class="form-control" id="title" name="title" value="{{ book.title }}" required>
                        </div>
                        <div class="col-md-6">
                            <label for="author" class="form-label">Author *</label>
                            <input type="text" class="form-control" id="author" name="author" value="{{ book.author }}" required>
                        </div>
                    </div>
                    <div class="row mb-3">
                        <div class="col-md-4">
                            <label for="subject" class="form-label">Subject</label>
                            <select class="form-select" id="subject" name="subject">
                                <option value="Computer Science" {% if book.subject == 'Computer Science' %}selected{% endif %}>Computer Science</option>
                                <option value="Mathematics" {% if book.subject == 'Mathematics' %}selected{% endif %}>Mathematics</option>
                                <option value="Physics" {% if book.subject == 'Physics' %}selected{% endif %}>Physics</option>
                                <option value="Manga" {% if book.subject == 'Manga' %}selected{% endif %}>Manga</option>
                                <option value="Novel" {% if book.subject == 'Novel' %}selected{% endif %}>Novel</option>
                                <option value="History" {% if book.subject == 'History' %}selected{% endif %}>History</option>
                                <option value="Engineering" {% if book.subject == 'Engineering' %}selected{% endif %}>Engineering</option>
                                <option value="Business" {% if book.subject == 'Business' %}selected{% endif %}>Business</option>
                                <option value="Other" {% if book.subject == 'Other' %}selected{% endif %}>Other</option>
                            </select>
                        </div>
                        <div class="col-md-4">
                            <label for="condition" class="form-label">Condition *</label>
                            <select class="form-select" id="condition" name="condition" required>
                                <option value="New" {% if book.condition == 'New' %}selected{% endif %}>New</option>
                                <option value="Like New" {% if book.condition == 'Like New' %}selected{% endif %}>Like New</option>
                                <option value="Used" {% if book.condition == 'Used' %}selected{% endif %}>Used</option>
                                <option value="Worn" {% if book.condition == 'Worn' %}selected{% endif %}>Worn</option>
                            </select>
                        </div>
                        <div class="col-md-4">
                            <label for="price" class="form-label">Price ($) *</label>
                            <input type="number" step="0.01" min="0" class="form-control" id="price" name="price" value="{{ book.price }}" required>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label for="description" class="form-label">Description (Optional)</label>
                        <textarea class="form-control" id="description" name="description" rows="4">{{ book.description }}</textarea>
                    </div>
                    
                    <div class="mb-4">
                        <label for="image" class="form-label">Update Photo (Optional)</label>
                        <input class="form-control" type="file" id="image" name="image" accept="image/png, image/jpeg, image/jpg, image/gif">
                        <div class="mt-2 text-center">
                            {% if book.image_path %}
                                <p class="text-muted small">Current image:</p>
                                <img id="image-preview" src="{{ url_for('static', filename=book.image_path) }}" alt="Current Image" style="max-height: 200px; margin: 0 auto; border-radius: 8px;" class="shadow-sm mb-2">
                            {% else %}
                                <img id="image-preview" src="#" alt="Image Preview" style="display: none; max-height: 200px; margin: 0 auto; border-radius: 8px;" class="shadow-sm mb-2">
                            {% endif %}
                        </div>
                    </div>
                    
                    <div class="d-flex gap-2">
                        <a href="{{ url_for('my_listings') }}" class="btn btn-secondary flex-grow-1">Cancel</a>
                        <button type="submit" class="btn btn-primary flex-grow-1">Update Ad</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
