{% extends 'base.html' %}

{% block title %}Verify Email - Student Book Exchange{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
        <div class="card shadow-sm mt-4">
            <div class="card-body p-4">
                <h3 class="card-title text-center mb-4">Verify Your Email</h3>
                <p class="text-center text-muted">We sent a 6-digit code to your email. It will expire in 5 minutes.</p>
                <form action="{{ url_for('verify_otp') }}" method="POST">
                    <div class="mb-3">
                        <label for="otp" class="form-label">Enter OTP</label>
                        <input type="text" class="form-control text-center fs-4 letter-spacing-2" id="otp" name="otp" required maxlength="6" pattern="\d{6}" placeholder="------">
                    </div>
                    <div class="d-grid">
                        <button type="submit" class="btn btn-primary">Verify and Register</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
